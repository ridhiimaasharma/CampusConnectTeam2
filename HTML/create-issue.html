<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Issue · CampusConnect</title>

    <link rel="stylesheet" href="../CSS/create-issue.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="topbar">

        <div class="site-name">
            CampusConnect
        </div>

        <nav class="navigation">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="create-issue.html" class="active">
                Report Issue
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="../signin.html">
    Sign out
</a>

        </nav>

    </header>


    <!-- Main Content -->
    <main class="create-page">

        <section class="form-container">

            <div class="page-heading">

                <h1>Report an Issue</h1>

                <p>
                    Help improve your campus by reporting an issue.
                </p>

            </div>


            <!-- Issue Form -->
            <form id="issueForm" class="issue-form">

                <!-- Title -->
                <div class="form-group">

                    <label for="title">
                        Issue Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. Fan not working in Room 204"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select a category
                        </option>

                        <option value="Classroom">
                            Classroom
                        </option>

                        <option value="Campus">
                            Campus
                        </option>

                        <option value="Library">
                            Library
                        </option>

                        <option value="Hostel">
                            Hostel
                        </option>

                        <option value="Canteen">
                            Canteen
                        </option>

                        <option value="Wi-Fi">
                            Wi-Fi / Internet
                        </option>

                        <option value="Lost & Found">
                            Lost &amp; Found
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Description -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="7"
                        placeholder="Describe the issue clearly..."
                        required
                    ></textarea>

                </div>


                <!-- Error / Success Message -->
                <p
                    id="formMessage"
                    class="form-message"
                    role="alert"
                ></p>


                <!-- Buttons -->
                <div class="form-actions">

                    <a
                        href="dashboard.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="button"
                    >
                        Submit Issue
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../JS/create-issue.js"></script>

</body>

</html>
