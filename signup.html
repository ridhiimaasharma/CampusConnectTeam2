
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · CampusConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/signup.css">
</head>
<body>
<main class="login-page">
  <div class="login-wrap">
    <div class="site-name">CampusConnect</div>
    <p class="page-note">Set up your campus account.</p>
    <form class="form-box" id="form" novalidate>
      <h1>Sign up</h1>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name">
      <label for="email">College email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="new-password">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <p class="message-error" id="err" role="alert"></p>
      <button class="button wide-button">Create account</button>
      <p class="form-link">Already registered? <a href="signin.html">Sign in</a></p>
    </form>
  </div>
</main>
<script src="JS/signup.js"></script>
</body>
</html>
